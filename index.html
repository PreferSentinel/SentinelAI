<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel-Intelligence</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="auth-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999; justify-content: center; align-items: center; backdrop-filter: blur(5px);">
    <div style="background: #121212; padding: 30px; border: 1px solid #00f2ff; border-radius: 10px; text-align: center; min-width: 300px;">
        <h3 style="font-family: 'Orbitron'; color: #00f2ff; margin-top: 0;">IDENTITY INITIALIZATION</h3>
        <input type="text" id="username-input" placeholder="Enter UID..." style="display: block; width: 100%; margin: 20px 0; padding: 12px; background: #0a0a0a; border: 1px solid #333; color: white; box-sizing: border-box;">
        <button id="login-confirm" style="background: #00f2ff; border: none; padding: 10px 20px; font-family: 'Orbitron'; cursor: pointer; width: 100%; font-weight: bold;">ACCESS SYSTEM</button>
    </div>
</div>
    <div class="app-container">
        <!-- Draggable Glass Header -->
        <header class="glass-header">
            <div class="logo-area">
                <span class="sentinel-icon">◈</span>
                <span class="app-title">SENTINEL INTELLIGENCE</span>
            </div>
            <div class="window-controls">
                <div class="account-section" style="display: flex; align-items: center; gap: 10px; margin-right: 15px; -webkit-app-region: no-drag;">
    <span id="user-display" style="font-family: 'Orbitron'; font-size: 11px; color: #00f2ff;">GUEST_AUTH</span>
    <button id="auth-trigger" style="background: rgba(255,255,255,0.1); border: 1px solid #333; color: white; cursor: pointer; border-radius: 4px; padding: 2px 8px;">👤 IDENTITY</button>
</div>
                <button class="control-btn minimize">─</button>
                <button class="control-btn maximize">□</button>
                <button class="control-btn close">✕</button>
            </div>
        </header>

        <div class="main-layout">
            <!-- Sidebar: Contextual Memory -->
            <aside class="sidebar memory-bank">
                <div class="sidebar-header">
                    <h3>KNOWLEDGE FRAGMENTS</h3>
                </div>
                <div class="memory-list" id="memory-list">
                    <!-- Dynamic memory items will be injected here -->
                    <div class="memory-item" style="animation-delay: 0.1s">
                        <span class="mem-icon">⌬</span>
                        <div class="mem-content">
                            <span class="mem-title">Project: Chimera</span>
                            <span class="mem-date">Last accessed: 2h ago</span>
                        </div>
                    </div>
                    <div class="memory-item" style="animation-delay: 0.2s">
                        <span class="mem-icon">⌘</span>
                        <div class="mem-content">
                            <span class="mem-title">Auth Protocol v2</span>
                            <span class="mem-date">Encrypted</span>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Command Center -->
            <main class="command-center">
                <!-- Dashboard / Mode Switcher -->
                <div class="dashboard-tiles">
                    <div class="tile active" data-mode="neural-stream">
                        <span class="tile-icon">⚡</span>
                        <span class="tile-label">Neural Stream</span>
                    </div>
                    <div class="tile" data-mode="code-guard">
                        <span class="tile-icon">🛡️</span>
                        <span class="tile-label">Code Guard</span>
                    </div>
                    <div class="tile" data-mode="shadow-writer">
                        <span class="tile-icon">✎</span>
                        <span class="tile-label">Shadow Writer</span>
                    </div>
                </div>

                <!-- Content Area -->
                <div id="content-area">
                    <!-- Neural Stream (Chat) -->
                    <div id="neural-stream" class="mode-view active">
                        <div class="chat-container" id="chat-container">
                            <div class="message ai-message">
                                <div class="avatar">SI</div>
                                <div class="bubble">
                                    <p class="typing-text">System initialized. Sentinel API online. Awaiting commands.</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Code Sandbox (Hidden by default) -->
                    <div id="code-sandbox" class="mode-view">
                        <div class="editor-header">
                            <span>main.js</span>
                            <span class="lang-tag">JAVASCRIPT</span>
                        </div>
                        <div class="editor-body">
                            <textarea id="monaco-mock" spellcheck="false">
function initSystem() {
    console.log("Sentinel Core Active");
    return true;
}
                            </textarea>
                        </div>
                    </div>
                </div>

                <!-- Input Zone -->
                <footer class="input-zone">
                    <div class="input-wrapper">
                        <textarea id="user-input" placeholder="Enter command protocol..." rows="1"></textarea>
                        <input type="file" id="image-input" accept="image/*" style="display:none;">

<button id="upload-btn" class="neural-link-btn" style="margin-right: 10px; width: auto; padding: 0 15px;">
    <span class="btn-text">📷</span>
    <span class="btn-text-glow"></span>
</button>
                        <button id="send-btn" class="neural-link-btn">
                            <span class="btn-text">LINK</span>
                            <span class="btn-glow"></span>
                        </button>
                    </div>
                </footer>
            </main>
        </div>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
